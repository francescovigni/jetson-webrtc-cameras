# MediaMTX configuration — minimal, only what we need.
logLevel: info
logDestinations: [stdout]

# Disable everything we don't use to keep the surface small.
api: no
metrics: no
pprof: no
playback: no
rtmp: no
hls: no
srt: no

# Internal RTSP endpoint that FFmpeg publishes the camera into.
# Not exposed in docker-compose; localhost only.
rtsp: yes
rtspAddress: :8554

# WebRTC (WHEP) is what the browser consumes.
webrtc: yes
webrtcAddress: :8889
# Single fixed UDP port for ICE so it's easy to expose / Tailscale-friendly.
webrtcLocalUDPAddress: :8189
# Gather host candidates from all interfaces (LAN + Tailscale) automatically.
# No STUN/TURN needed: LAN is direct, Tailscale is already a direct overlay.

# NOTE: no `paths:` block here on purpose. entrypoint.sh appends one generated
# from /cameras.d/, so adding a camera never means editing this file. The
# assembled config is written to /etc/mediamtx.yml — inspect it with:
#   docker exec webcam_home cat /etc/mediamtx.yml
