# MediaMTX configuration — minimal, only what we need.
logLevel: info
logDestinations: [stdout]

# Disable everything we don't use to keep the surface small.
api: no
metrics: no
pprof: no
playback: no
rtmp: no
hls: no
srt: no

# Internal RTSP endpoint that FFmpeg publishes the camera into.
# Not exposed in docker-compose; localhost only.
rtsp: yes
rtspAddress: :8554

# WebRTC (WHEP) is what the browser consumes.
webrtc: yes
webrtcAddress: :8889
# Single fixed UDP port for ICE so it's easy to expose / Tailscale-friendly.
webrtcLocalUDPAddress: :8189
# Gather host candidates from all interfaces (LAN + Tailscale) automatically.
# No STUN/TURN needed: LAN is direct, Tailscale is already a direct overlay.

paths:
  # The USB Logitech C250: video + audio. Reachable at
  # http://<host>:8889/usb/whep
  usb:
    # On-demand, not runOnInit: with two cameras, always-on would mean two
    # encoders on a Nano. The pipeline starts when a viewer attaches and
    # lingers for runOnDemandCloseAfter, so a page reload or a switch away and
    # straight back reuses it instead of re-opening the USB device.
    runOnDemand: sh /start-ffmpeg.sh
    runOnDemandRestart: yes
    # Longer than the 10s default: v4l2 open plus the first keyframe.
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 10s

  # The onboard CSI camera (IMX219), video only. Reachable at
  # http://<host>:8889/csi/whep
  csi:
    runOnDemand: sh /start-csi.sh
    runOnDemandRestart: yes
    # argus init is slower than v4l2 open.
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 10s
