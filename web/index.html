<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webcam Home — Live</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
      background: #0e0f13; color: #e7e9ee;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0; letter-spacing: .02em; }
    .stage {
      position: relative; width: min(92vw, 860px); aspect-ratio: 4 / 3;
      background: #000; border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
    }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    .overlay {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: .95rem; color: #aab; pointer-events: none;
      background: rgba(0,0,0,.35); transition: opacity .3s;
    }
    .overlay.hidden { opacity: 0; }
    .bar { display: flex; gap: .6rem; align-items: center; }
    button {
      background: #2b6cff; color: #fff; border: 0; border-radius: 8px;
      padding: .5rem .9rem; font-size: .9rem; cursor: pointer;
    }
    button.secondary { background: #2a2d36; }
    select {
      background: #2a2d36; color: #e7e9ee; border: 0; border-radius: 8px;
      padding: .5rem .6rem; font-size: .9rem; cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .dot { width: .6rem; height: .6rem; border-radius: 50%; background: #f0b429; }
    .dot.live { background: #2ec27e; }
    .dot.down { background: #e5484d; }
    .status { font-size: .85rem; color: #9aa; }
  </style>
</head>
<body>
  <h1>Webcam Home</h1>

  <div class="stage">
    <!-- One element plays both video + audio. Starts muted so autoplay is
         allowed by browser policy; user clicks Unmute for sound. -->
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay" class="overlay">Connecting…</div>
  </div>

  <div class="bar">
    <span id="dot" class="dot"></span>
    <span id="status" class="status">Connecting…</span>
    <select id="cam" aria-label="Camera"></select>
    <button id="unmute">🔊 Unmute</button>
    <button id="reconnect" class="secondary">↻ Reconnect</button>
  </div>

  <script>
    // WHEP endpoint is derived from whatever host you browsed to (LAN IP or
    // Tailscale name), so the same page works on both without editing.
    // Two physically fixed cameras on this Jetson, so they are hardcoded — no
    // discovery endpoint, and MediaMTX's API stays disabled.
    const CAMS = { usb: "USB — C250 (with mic)", csi: "CSI — IMX219 (video only)" };
    const DEFAULT_CAM = "usb";

    // hasOwnProperty, not `CAMS[stored]`: a stored value of "constructor" or
    // "toString" is truthy on any object and would strand the player on a path
    // that 404s forever.
    function resolveCam(stored) {
      return Object.prototype.hasOwnProperty.call(CAMS, stored) ? stored : DEFAULT_CAM;
    }

    // localStorage can throw outright in a private window, so guard every access.
    let storedCam = null;
    try { storedCam = localStorage.getItem("cam"); } catch (_) {}
    let cam = resolveCam(storedCam);

    // Derived per connect(), not once: the camera changes at runtime. The host
    // still comes from the page URL, so LAN and Tailscale both keep working.
    const whepUrl = () => `${location.protocol}//${location.hostname}:8889/${cam}/whep`;

    // Which MediaStream an ontrack event should bind, or null to leave the
    // current one alone. MediaMTX answers a video-only path (the CSI camera)
    // with an empty audio m-line that carries no a=msid, so ontrack fires a
    // second time with e.streams empty. Assigning e.streams[0] there would
    // clear the video stream bound a moment earlier and leave a black player
    // reporting "Live".
    function streamToBind(eventStreams, current) {
      const stream = eventStreams[0];
      if (!stream) return null;
      return stream === current ? null : stream;
    }

    // Exposed for web/selftest.js.
    window.__CAMS = CAMS;
    window.__resolveCam = resolveCam;
    window.__streamToBind = streamToBind;

    const video     = document.getElementById("video");
    const overlay   = document.getElementById("overlay");
    const statusEl  = document.getElementById("status");
    const dot       = document.getElementById("dot");
    const unmuteBtn = document.getElementById("unmute");

    let pc = null;
    let generation = 0;        // invalidates stale callbacks after teardown
    let retryTimer = null;

    function setStatus(text, state) {
      statusEl.textContent = text;
      dot.className = "dot" + (state ? " " + state : "");
      if (state === "live") {
        overlay.classList.add("hidden");
      } else {
        overlay.textContent = text;
        overlay.classList.remove("hidden");
      }
    }

    function teardown() {
      generation++;            // any in-flight handlers become no-ops
      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      if (pc) { try { pc.close(); } catch (_) {} pc = null; }
      video.srcObject = null;
    }

    function scheduleReconnect(delayMs) {
      if (retryTimer) return;
      setStatus("Reconnecting…", "");
      retryTimer = setTimeout(() => { retryTimer = null; connect(); }, delayMs);
    }

    async function waitForIceGathering(peer) {
      if (peer.iceGatheringState === "complete") return;
      await new Promise((resolve) => {
        const done = () => {
          if (peer.iceGatheringState === "complete") {
            peer.removeEventListener("icegatheringstatechange", done);
            resolve();
          }
        };
        peer.addEventListener("icegatheringstatechange", done);
        // Fallback: don't block forever if the last candidate is slow.
        setTimeout(resolve, 2000);
      });
    }

    async function connect() {
      teardown();
      const myGen = ++generation;
      window.__activeCam = cam;
      setStatus("Connecting…", "");

      // No STUN/TURN: LAN is direct and Tailscale is already a direct overlay.
      pc = new RTCPeerConnection({ iceServers: [] });

      pc.addTransceiver("video", { direction: "recvonly" });
      pc.addTransceiver("audio", { direction: "recvonly" });

      pc.ontrack = (e) => {
        if (myGen !== generation) return;
        const next = streamToBind(e.streams, video.srcObject);
        if (next) video.srcObject = next;
      };

      pc.onconnectionstatechange = () => {
        if (myGen !== generation || !pc) return;
        const s = pc.connectionState;
        if (s === "connected") {
          setStatus("Live", "live");
        } else if (s === "failed" || s === "disconnected" || s === "closed") {
          setStatus("Connection lost", "down");
          scheduleReconnect(2000);
        }
      };

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await waitForIceGathering(pc);
        if (myGen !== generation) return;

        const res = await fetch(whepUrl(), {
          method: "POST",
          headers: { "Content-Type": "application/sdp" },
          body: pc.localDescription.sdp,
        });
        if (!res.ok) throw new Error(`WHEP ${res.status}`);

        const answer = await res.text();
        if (myGen !== generation) return;
        await pc.setRemoteDescription({ type: "answer", sdp: answer });
      } catch (err) {
        if (myGen !== generation) return;
        setStatus("Stream offline — retrying…", "down");
        scheduleReconnect(3000);   // e.g. camera not ready yet after boot
      }
    }

    const camSel = document.getElementById("cam");
    for (const [value, label] of Object.entries(CAMS)) {
      camSel.add(new Option(label, value, false, value === cam));
    }

    camSel.addEventListener("change", () => {
      cam = camSel.value;
      try { localStorage.setItem("cam", cam); } catch (_) {}
      // connect() calls teardown() first, which bumps `generation` so any
      // in-flight callback from the previous camera becomes a no-op. That is
      // what makes fast repeated switching safe.
      connect();
    });

    // The two cameras have different aspect ratios (4:3 and 16:9); let the stage
    // follow the frame instead of letterboxing inside a hardcoded 4/3 box.
    video.addEventListener("loadedmetadata", () => {
      if (video.videoWidth && video.videoHeight) {
        document.querySelector(".stage").style.aspectRatio =
          `${video.videoWidth} / ${video.videoHeight}`;
      }
    });

    unmuteBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      unmuteBtn.textContent = video.muted ? "🔊 Unmute" : "🔇 Mute";
      video.play().catch(() => {});
    });

    document.getElementById("reconnect").addEventListener("click", connect);

    // Re-establish promptly when the tab becomes visible again.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && (!pc || pc.connectionState !== "connected")) connect();
    });

    connect();
  </script>
</body>
</html>
